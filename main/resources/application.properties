server.port=${PORT:8080}
spring.application.name=Ai-chatbot

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==================================================
# GEMINI CHAT
# ==================================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

# ==================================================
# MYSQL
# ==================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:deadlineiq;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# ==================================================
# JPA
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# GEMINI EMBEDDINGS
# ==================================================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.project-id=gen-lang-client-0907690031
spring.ai.google.genai.embedding.location=us-central1
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ==================================================
# PINECONE
# ==================================================
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=ai-rag-documents
spring.ai.vectorstore.pinecone.namespace=default
