server.port=${PORT:8080}
spring.application.name=DeadlineIQ-Backend
spring.main.allow-bean-definition-overriding=true
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==================================================
# GEMINI CHAT
# ==================================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}

# ==================================================
# MYSQL DATABASE (deadlineiq)
# ==================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / HIBERNATE
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# GEMINI EMBEDDINGS
# ==================================================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ==================================================
# PINECONE VECTOR STORE
# ==================================================
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:chatbot}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:default}
